<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3f4a"/>
      <stop offset="100%" stop-color="#1b1e25"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2d35"/>
      <stop offset="100%" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#FFB38A"/>
      <stop offset="100%" stop-color="#FF4F1F"/>
    </linearGradient>
    <radialGradient id="glint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7A45" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF4F1F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mantel / Körper -->
  <path d="M80 512 C84 410 140 350 256 346 C372 350 428 410 432 512 Z" fill="url(#coat)"/>
  <!-- Revers -->
  <path d="M256 360 L196 512 L168 512 L214 368 Z" fill="#14161b"/>
  <path d="M256 360 L316 512 L344 512 L298 368 Z" fill="#14161b"/>
  <!-- Hemd + Krawatte -->
  <path d="M232 366 L256 512 L280 366 Z" fill="#d8dbe2"/>
  <path d="M248 372 L264 372 L270 470 L256 494 L242 470 Z" fill="#FF4F1F"/>
  <!-- Knöpfe -->
  <circle cx="196" cy="452" r="6" fill="#0d0f13"/>
  <circle cx="316" cy="452" r="6" fill="#0d0f13"/>

  <!-- Hochgeschlagener Kragen hinten -->
  <path d="M150 360 Q160 280 200 262 L214 352 Z" fill="#2c3039"/>
  <path d="M362 360 Q352 280 312 262 L298 352 Z" fill="#2c3039"/>

  <!-- Kopf (Schatten) -->
  <ellipse cx="256" cy="246" rx="70" ry="82" fill="#22252d"/>
  <!-- Unterer Gesichtsteil: Kinn + Mund -->
  <path d="M206 276 Q256 336 306 276 Q300 316 256 326 Q212 316 206 276 Z" fill="#2c3039"/>
  <!-- Grinsen -->
  <path d="M236 292 Q258 304 280 288" stroke="#0d0f13" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Zahnstocher -->
  <path d="M276 292 L318 282" stroke="#E9C38A" stroke-width="5" stroke-linecap="round"/>

  <!-- Kragen vorne (verdeckt Hals) -->
  <path d="M176 368 Q190 300 214 280 L246 344 L232 372 Z" fill="#3a3f4a"/>
  <path d="M336 368 Q322 300 298 280 L266 344 L280 372 Z" fill="#3a3f4a"/>

  <!-- Brille: Glanz-Schein -->
  <circle cx="226" cy="236" r="40" fill="url(#glint)"/>
  <circle cx="290" cy="236" r="40" fill="url(#glint)"/>
  <!-- Brillengläser (spiegeln, Augen unsichtbar) -->
  <circle cx="226" cy="236" r="24" fill="url(#lens)" stroke="#0d0f13" stroke-width="6"/>
  <circle cx="290" cy="236" r="24" fill="url(#lens)" stroke="#0d0f13" stroke-width="6"/>
  <path d="M250 234 Q258 228 266 234" stroke="#0d0f13" stroke-width="6" fill="none"/>
  <!-- Lichtreflex -->
  <path d="M212 228 L230 218" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M276 228 L294 218" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Hut: Krempe -->
  <ellipse cx="256" cy="196" rx="150" ry="30" fill="url(#hat)"/>
  <!-- Hut: Krone -->
  <path d="M168 196 C164 130 196 82 256 82 C316 82 348 130 344 196 Q256 214 168 196 Z" fill="url(#hat)"/>
  <!-- Delle oben -->
  <path d="M226 92 Q256 116 286 92" stroke="#0d0f13" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Hutband -->
  <path d="M170 176 Q256 196 342 176 L344 196 Q256 214 168 196 Z" fill="#FF4F1F"/>
  <!-- Schatten unter der Krempe -->
  <path d="M190 210 Q256 228 322 210 Q256 236 190 210 Z" fill="#0d0f13" opacity="0.6"/>

  <!-- Lupe -->
  <g transform="rotate(-25 400 430)">
    <rect x="392" y="440" width="18" height="70" rx="8" fill="#5b3a22"/>
    <circle cx="401" cy="404" r="44" fill="#FFE2D3" fill-opacity="0.35" stroke="#c9ccd4" stroke-width="10"/>
    <path d="M378 386 Q388 372 404 370" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
